name: Core Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Run Core 5 acceptance profile
        run: make acceptance PROFILE=core5 ACCEPTANCE_REPORT=acceptance-report.json

      - name: Print machine-readable report
        if: always()
        run: |
          if test -f acceptance-report.json; then
            cat acceptance-report.json
          else
            echo "acceptance report was not produced"
          fi

  core5-shellbody:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          path: core
          fetch-depth: 1

      - name: Checkout pinned Shell Body
        uses: actions/checkout@v4
        with:
          repository: Neon-Dolls/neondoll-shellbody
          ref: 10b2d510d9a5887800c8e6f72c2ef05530bf6c46
          path: shellbody
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: |
            core/go.sum
            shellbody/go.sum

      - name: Run Core 5 external Shell Body acceptance
        working-directory: core
        run: make acceptance-external PROFILE=core5 SHELLBODY_SOURCE="$GITHUB_WORKSPACE/shellbody" ACCEPTANCE_REPORT=acceptance-shellbody-report.json

      - name: Print machine-readable report
        if: always()
        working-directory: core
        run: |
          if test -f acceptance-shellbody-report.json; then
            cat acceptance-shellbody-report.json
          else
            echo "external acceptance report was not produced"
          fi

  core5-telegram-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          path: core
          fetch-depth: 1

      - name: Checkout pinned Telegram Gateway
        uses: actions/checkout@v4
        with:
          repository: dividebyzero/neondoll-gateway-telegram
          ref: 962e09b396a389950ed2d926ba38efc4baf37dfd
          path: telegram-gateway
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: |
            core/go.sum
            telegram-gateway/go.sum
            telegram-gateway/wasm/gateway/go.sum

      - name: Set up TinyGo
        uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: "0.39.0"

      - name: Run real Telegram WASM acceptance
        working-directory: core
        run: make acceptance-telegram PROFILE=core5 TELEGRAM_GATEWAY_SOURCE="$GITHUB_WORKSPACE/telegram-gateway" ACCEPTANCE_REPORT=acceptance-telegram-report.json

      - name: Print machine-readable report
        if: always()
        working-directory: core
        run: |
          if test -f acceptance-telegram-report.json; then
            cat acceptance-telegram-report.json
          else
            echo "Telegram acceptance report was not produced"
          fi
